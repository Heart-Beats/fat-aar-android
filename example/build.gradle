buildscript {
    repositories {
        mavenCentral()
        google()
        jcenter()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.2'
        classpath 'com.github.kezong:fat-aar:1.3.8'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.3.72"
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        jcenter()
    }
}

ext.verifyFatAarArchive = { File aarFile, Map expected ->
    int checkCount = 0
    def fail = { String issue ->
        throw new GradleException("Fat AAR verification failed for '${aarFile.absolutePath}': ${issue}")
    }
    def check = { boolean condition, String issue ->
        checkCount++
        if (!condition) {
            fail(issue)
        }
    }
    check(aarFile.isFile() && aarFile.canRead(), 'AAR is missing or unreadable')

    java.util.zip.ZipFile aar = null
    try {
        aar = new java.util.zip.ZipFile(aarFile)
        Set<String> outerEntries = new LinkedHashSet<String>()
        aar.entries().each { outerEntries.add(it.name) }

        expected.entries.each { String entryName ->
            check(outerEntries.contains(entryName), "missing AAR entry '${entryName}'")
        }
        expected.prefixes.each { String prefix ->
            check(outerEntries.any { it.startsWith(prefix) }, "missing AAR entry with prefix '${prefix}'")
        }

        expected.textContains.each { String entryName, List<String> markers ->
            def entry = aar.getEntry(entryName)
            check(entry != null, "missing AAR entry '${entryName}'")
            InputStream stream = null
            try {
                stream = aar.getInputStream(entry)
                String text = stream.getText('UTF-8')
                markers.each { String marker ->
                    check(text.contains(marker), "entry '${entryName}' is missing marker '${marker}'")
                }
            } finally {
                if (stream != null) {
                    stream.close()
                }
            }
        }

        def classesEntry = aar.getEntry('classes.jar')
        check(classesEntry != null, "missing AAR entry 'classes.jar'")
        InputStream classesInput = null
        java.util.zip.ZipInputStream classesJar = null
        Set<String> classEntries = new LinkedHashSet<String>()
        String serviceText = null
        try {
            classesInput = aar.getInputStream(classesEntry)
            classesJar = new java.util.zip.ZipInputStream(classesInput)
            java.util.zip.ZipEntry classEntry
            byte[] buffer = new byte[4096]
            while ((classEntry = classesJar.nextEntry) != null) {
                classEntries.add(classEntry.name)
                if (classEntry.name == expected.serviceEntry) {
                    ByteArrayOutputStream output = new ByteArrayOutputStream()
                    int count
                    while ((count = classesJar.read(buffer)) != -1) {
                        output.write(buffer, 0, count)
                    }
                    serviceText = new String(output.toByteArray(), 'UTF-8')
                }
                classesJar.closeEntry()
            }
        } finally {
            if (classesJar != null) {
                classesJar.close()
            } else if (classesInput != null) {
                classesInput.close()
            }
        }

        expected.classEntries.each { String entryName ->
            check(classEntries.contains(entryName), "classes.jar is missing '${entryName}'")
        }
        (expected.forbiddenClassEntries ?: []).each { String entryName ->
            check(!classEntries.contains(entryName), "classes.jar must not contain '${entryName}'")
        }
        def kotlinModules = classEntries.findAll {
            it.startsWith('META-INF/') && it.endsWith('.kotlin_module')
        }
        check(!kotlinModules.isEmpty(), 'classes.jar is missing Kotlin metadata')
        check(classEntries.contains(expected.kotlinModule), "classes.jar is missing lib-aar2 Kotlin metadata '${expected.kotlinModule}'")
        check(serviceText != null, "classes.jar is missing SPI entry '${expected.serviceEntry}'")
        List<String> providers = serviceText == null ? [] : serviceText.readLines().collect { it.trim() }.findAll {
            !it.isEmpty() && !it.startsWith('#')
        }
        check(providers.size() == expected.serviceProviders.size() &&
                providers.toSet() == expected.serviceProviders.toSet(),
                "SPI entry '${expected.serviceEntry}' expected exactly ${expected.serviceProviders} but was ${providers}")
        println("[fat-aar] verified '${aarFile.absolutePath}' (${checkCount} checks)")
    } catch (GradleException exception) {
        throw exception
    } catch (Exception exception) {
        throw new GradleException("Fat AAR verification failed for '${aarFile.absolutePath}': cannot read archive", exception)
    } finally {
        if (aar != null) {
            aar.close()
        }
    }
}
