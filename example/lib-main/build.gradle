apply plugin: 'com.android.library'
apply plugin: 'com.kezong.fat-aar'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

repositories {
    flatDir {
        dirs 'libs'
    }
}

android {
    compileSdkVersion 29

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 27
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "default"

    productFlavors {
        flavor1 {
            missingDimensionStrategy 'default2', 'flavor3'
        }

        flavor2 {
            missingDimensionStrategy 'default2', 'flavor3'
        }
    }

    packagingOptions {
        exclude 'lib/x86/*.so'
        exclude 'lib/x86_64/*.so'
        exclude 'lib/armeabi/*.so'
        exclude 'lib/arm64-v8a/*.so'
    }
}

def registerNestedFatAarVerification = { String variantName ->
    String variantCapitalized = variantName.capitalize()
    def bundleTask = tasks.named("bundle${variantCapitalized}Aar")
    def reBundleTask = tasks.named("reBundleAar${variantCapitalized}")
    tasks.register("verifyNestedFatAar${variantCapitalized}") {
        group = 'verification'
        description = "Verifies the final nested fat AAR archive for ${variantName}."
        dependsOn reBundleTask
        inputs.file(reBundleTask.flatMap { it.archiveFile })
        doLast {
            def sourceAar = bundleTask.get().archiveFile.get().asFile
            def finalAar = reBundleTask.get().archiveFile.get().asFile
            if (sourceAar.toPath().normalize() == finalAar.toPath().normalize()) {
                throw new GradleException("Source and final fat AAR paths must differ: '${sourceAar.absolutePath}'")
            }
            rootProject.ext.verifyFatAarArchive(finalAar, [
                    entries         : [
                            'AndroidManifest.xml',
                            'R.txt',
                            'proguard.txt',
                            'jni/armeabi-v7a/libnested_embed_marker.so',
                            'data-binding/com.kezong.demo.libaar-br.bin',
                            'data-binding-base-class-log/com.kezong.demo.libaar-binding_classes.json',
                            'data-binding/com.kezong.demo.libaar2-br.bin',
                            'data-binding-base-class-log/com.kezong.demo.libaar2-binding_classes.json',
                    ],
                    prefixes        : ['data-binding/', 'data-binding-base-class-log/'],
                    textContains    : [
                            'AndroidManifest.xml': [
                                    'android.permission.BLUETOOTH',
                                    'android.permission.ACCESS_NETWORK_STATE',
                            ],
                            'R.txt'              : [
                                    'int string app_name_aar ',
                                    'int string app_name_aar2 ',
                            ],
                            'proguard.txt'       : [
                                    'com.kezong.demo.libaar.AarLibClass',
                                    'com.kezong.demo.libaar2.NestedEmbedKotlinMarker',
                            ],
                    ],
                    classEntries    : [
                            'com/kezong/demo/lib/MainLibClass.class',
                            'com/kezong/demo/libaar/AarLibClass.class',
                            'com/kezong/demo/libaar2/Aar2LibClass.class',
                            'com/kezong/demo/libaar2/NestedEmbedKotlinMarker.class',
                    ],
                    serviceEntry    : 'META-INF/services/com.kezong.demo.spi.NestedEmbedService',
                    serviceProviders: [
                            'com.kezong.demo.libaar.spi.LibAarService',
                            'com.kezong.demo.libaar2.spi.LibAar2Service',
                    ],
                    kotlinModule    : 'META-INF/lib-aar2_flavor3Debug.kotlin_module',
                    forbiddenClassEntries: [
                            'META-INF/lib-aar2_flavor4Debug.kotlin_module',
                    ],
            ])
        }
    }
}

gradle.projectsEvaluated {
    registerNestedFatAarVerification('flavor1Debug')
    registerNestedFatAarVerification('flavor2Debug')

    tasks.register('verifyNestedTaskRange') {
        group = 'verification'
        description = 'Asserts that consuming :lib-aar through :lib-main does not build descendant merge/rebundle tasks.'
        dependsOn 'assembleFlavor1Debug'
        doLast {
            def forbiddenPrefixes = ['mergeEmbeddedClasses', 'rewriteRClasses', 'reBundleAar', 'mergeClasses', 'transformClassesWithTransformR']
            def offenders = gradle.taskGraph.allTasks.findAll { task ->
                (task.project.path == ':lib-aar' || task.project.path == ':lib-aar2') &&
                        forbiddenPrefixes.any { task.name.startsWith(it) }
            }
            if (!offenders.isEmpty()) {
                throw new GradleException("Nested consumption must not build descendant merge/rebundle tasks, " +
                        "but found: ${offenders*.path.sort().join(', ')}. Each descendant's own assemble must be " +
                        "the only entry point for its merge/rebundle tasks.")
            }
            def rootMerge = gradle.taskGraph.allTasks.findAll { task ->
                task.project.path == ':lib-main' && task.name.startsWith('mergeEmbeddedClasses')
            }
            if (rootMerge.isEmpty()) {
                throw new GradleException("Expected :lib-main to run mergeEmbeddedClasses for its flattened graph.")
            }
            println "[fat-aar][verify] task range OK; :lib-main merge tasks: ${rootMerge*.path.join(', ')}"
        }
    }

    def flavor1DebugReBundleTask = tasks.named('reBundleAarFlavor1Debug')
    tasks.register('syncVerifiedFatAarForApp', Copy) {
        group = 'verification'
        description = 'Copies the verified flavor1Debug fat AAR for the app integration build.'
        dependsOn tasks.named('verifyNestedFatAarFlavor1Debug')
        from flavor1DebugReBundleTask.flatMap { it.archiveFile }
        into rootProject.file('app/libs')
        rename { 'fat-aar-final.aar' }
        inputs.file(flavor1DebugReBundleTask.flatMap { it.archiveFile })
        outputs.file(rootProject.file('app/libs/fat-aar-final.aar'))
    }
}

fataar {
    /**
     * If transitive is true, local jar module and remote library's dependencies will be embed.
     * If transitive is false, just embed first level dependency
     * Local aar project does not support transitive, always embed first level
     * Default value is false
     * @since 1.3.0
     */
    transitive = true
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
    // java dependency
    embed project(path: ':lib-java', configuration: 'default')
    // aar dependency
    embed project(path: ':lib-aar', configuration: 'default')
    // local full aar dependency, just build in flavor1
    flavor1Embed project(path: ':lib-aar-local', configuration: 'default')
    // local full aar dependency, just build in debug
    debugEmbed (name:'lib-aar-local2', ext:'aar')
    // remote dependency
    embed 'com.google.guava:guava:20.0'
    // remote aar dependency
    embed ('com.facebook.fresco:fresco:1.12.0') {
        // exclude any group or module
        // exclude(group:'com.facebook.soloader', module:'soloader')
    }
    // remote aar dependency
    embed ('com.github.bumptech.glide:glide:4.11.0') {
        // If transitive = false, it will not embed dependencies declared in pom.xml
        // If fataar.transitive = false, There is no need to declare.
        transitive = false
    }
    // don't want to embed in
    implementation('androidx.appcompat:appcompat:1.2.0')
}

